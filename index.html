<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر رقمي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            text-align: right;
        }
        header {
            background-color: #2c3e50;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 20px auto;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .card p {
            color: #7f8c8d;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #27ae60;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <header>
        <h1>متجر الخدمات الرقمية</h1>
        <p>أفضل الخدمات والبطاقات الرقمية بأسرع وقت</p>
    </header>

    <div class="container">
        <div class="products-grid">
            <div class="card">
                <h3>شحن رصيد / ألعاب</h3>
                <p>خدمات شحن سريع وآمن للألعاب والمنصات الرقمية.</p>
                <a href="#" class="btn">اطلب الان</a>
            </div>
            
            <div class="card">
                <h3>حسابات مميزة</h3>
                <p>حسابات موثقة وجاهزة للاستخدام الفوري.</p>
                <a href="#" class="btn">اطلب الان</a>
            </div>

            <div class="card">
                <h3>اشتراكات رقمية</h3>
                <p>اشتراكات رسمية وبأفضل الأسعار المتاحة.</p>
                <a href="#" class="btn">اطلب الان</a>
            </div>
        </div>
    </div>

</body>
</html>
